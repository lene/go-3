# This GitHub Actions workflow performs a Codacy security scan on your repository.
# It checks out code, runs the Codacy Analysis CLI to produce a SARIF report,
# and then uploads that SARIF file to GitHub's advanced security code scanning.

name: Codacy Security Scan

on:
  push:
    branches: [ "master" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "master" ]
  schedule:
    # Run every Sunday at 03:20 UTC
    - cron: '20 3 * * 0'

permissions:
  contents: read         # needed to fetch code and read contents
  security-events: write # needed to upload SARIF results

jobs:
  codacy-security-scan:
    name: Codacy Security Scan
    runs-on: ubuntu-latest

    # Additional permissions if in a private repository
    # or if you want to limit scope for security:
    permissions:
      contents: read         # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read          # only required for a private repository
                             # by github/codeql-action/upload-sarif to get the Action run status

    steps:
      # Step 1: Check out code from this repository
      - name: Check out repository
        uses: actions/checkout@v3
        # If needed, specify a particular ref or submodules:
        # with:
        #   ref: ${{ github.ref }}
        #   submodules: true

      # Step 2: Run Codacy Analysis CLI to create a SARIF file
      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@d840f886c4bd4edc059706d09c6a1586111c540b
        with:
          # Provide your Codacy project token from repository secrets.
          # You can omit if the underlying tools can run with default config only.
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}

          # Enable verbose logging to get more details in the build logs.
          verbose: true

          # Name of the SARIF output file.
          output: results.sarif

          # Output format set to 'sarif' so it can be used by GitHub code scanning.
          format: sarif

          # Force GitHub code scanning compatible severities for non-security issues.
          gh-code-scanning-compat: true

          # The maximum number of issues allowed before failing the job,
          # set to a large number so Codacy won't block generation of the SARIF.
          max-allowed-issues: 2147483647

      # Step 3: Upload the SARIF file to GitHub code scanning
      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: results.sarif

