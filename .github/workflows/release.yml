name: Release

# Creates the tag and GitHub release for the version in build.sbt once CI has passed on master.
# Commits that do not change the version (e.g. "CI Fix" commits) find the tag present and skip.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - id: version
        run: |
          VERSION=$(grep 'version :=' build.sbt | cut -d '"' -f 2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git tag | grep -q "^${VERSION}\$"; then
            echo "Tag $VERSION already exists, nothing to release"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          name: deployable
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.version.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh release create "$VERSION" "go-3d-${VERSION}.zip" \
            --target "$SHA" --title "Release $VERSION" --generate-notes
