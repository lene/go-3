version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/setup-jvm"
    schedule:
      interval: "weekly"
    # Action updates are CI-only changes: the "CI Fix" prefix lets the version-consistent job
    # skip the version bump check (see CLAUDE.md, "CI Fix Commits").
    commit-message:
      prefix: "CI Fix"
  # Builder and runtime image tags and digests in the Dockerfile
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "CI Fix"
  # The ecosystems below are dependency updates, which need a version bump (AGENTS.md): no
  # "CI Fix" prefix, so version-consistent fails until the bump is pushed onto the PR.
  # Training dependencies (training/uv.lock)
  - package-ecosystem: "uv"
    directory: "/training"
    schedule:
      interval: "weekly"
  # The game analysis scripts (Poetry, pyproject.toml and poetry.lock)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
  # AWS provider versions; apply still needs the reviewed plan in the production environment
  - package-ecosystem: "terraform"
    directories:
      - "/infra/terraform/bootstrap"
      - "/infra/terraform/go3d-readonly"
    schedule:
      interval: "weekly"
