name: Set up JVM and sbt
description: JDK and sbt setup shared by all workflows, so the JDK policy lives in one place

inputs:
  cache-group:
    description: >
      Which dependency cache the job shares: "full" for jobs that resolve the engine too (its
      ONNX Runtime jar is most of the cache), "root" for jobs that need the root project only.
      One cache per group rather than per job keeps the repository under its cache limit.
    default: root

runs:
  using: composite
  steps:
    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: 25
        check-latest: true
    - uses: sbt/setup-sbt@20cf087132cf939c160f0e53f87ba33634003e3e # v1
    # the coursier, ivy and sbt caches; unlike setup-java's sbt cache it falls back to the newest
    # cache of an earlier build, so a PR that bumps the version in build.sbt starts from master's
    - uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1
      with:
        job: ${{ inputs.cache-group }}
