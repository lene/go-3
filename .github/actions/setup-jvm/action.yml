name: Set up JVM and sbt
description: JDK and sbt setup shared by all workflows, so the JDK policy lives in one place

runs:
  using: composite
  steps:
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: 25
        check-latest: true
        cache: sbt
    - uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1
