[project]
name = "go3d-training"
version = "0.1.0"
description = "Policy-and-value network and model contract for the go-3 AlphaZero engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "onnx>=1.17",
    "onnxscript>=0.2",
    "torch>=2.6",
]

[project.scripts]
export-generation = "go3d_training.export:main"
train-generation = "go3d_training.train:main"

[dependency-groups]
dev = ["onnxruntime>=1.20", "pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["go3d_training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
