[project]
name = "go3d-training"
version = "0.1.0"
description = "Policy-and-value network and model contract for the go-3 AlphaZero engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "onnx>=1.17",
    "onnxscript>=0.2",
    "torch>=2.6",
]

# The default install takes torch from PyPI, the CUDA build on Linux, to train on a GPU. CI takes
# the CPU build, a much smaller download, with `uv sync --extra cpu`. The `cuda` extra only names
# the default: uv resolves the default and the CPU build apart only for two conflicting extras.
[project.optional-dependencies]
cpu = ["torch>=2.6"]
cuda = ["torch>=2.6"]

[project.scripts]
export-generation = "go3d_training.export:main"
train-generation = "go3d_training.train:main"
promotion-loop = "go3d_training.loop:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "onnxruntime>=1.20",
    "pytest>=8.3",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["go3d_training"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["go3d_training"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
