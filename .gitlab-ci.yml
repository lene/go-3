# GitLab is a read-only mirror of https://github.com/lene/go-3, which runs the primary CI
# (.github/workflows). Only GitLab's security scanners run here; build, test and release jobs
# must not be added back, or the mirror would create duplicate tags and releases.

stages:
  - test

include:
  - template: Code-Quality.gitlab-ci.yml
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
